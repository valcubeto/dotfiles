[general]
import = [
  "./themes/vega.toml"
]

[window]
opacity = 0.80
startup_mode = "Fullscreen"
# padding = { x = 7, y = 7 }
# blur = true
dynamic_padding = true

[font]
normal = { family = "JetBrains Mono Nerd Font", style = "Regular" }
size = 16.5

[cursor.style]
shape = "Beam"
blinking = "Always"

[cursor]
blink_timeout = 0

[mouse]
hide_when_typing = true
bindings = [
  { mouse = "Right", mods = "Control", action = "None" },
  { mouse = "Middle", mods = "Control", action = "None" },
]

[keyboard]
bindings = [
  {                         key = "F11", action = "ToggleFullscreen" },
  { mods = "Control",       key = "M",   action = "None" },
  { mods = "Control|Shift", key = "M",   action = "None" },
  { mods = "Control",       key = "O",   action = "None" },
  { mods = "Control|Shift", key = "L",   action = "ClearHistory" },
  { mods = "Control|Shift", key = "N",   action = "SpawnNewInstance" }
]
